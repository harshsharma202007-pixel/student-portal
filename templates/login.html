<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Management | Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">🎓</div>
            <h1>Student Portal</h1>
            <p class="subtitle">Student Profile Management System</p>        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login to Portal →</button>
        </form>

        <div class="demo-info">
            <strong>Demo Login</strong>
            <p>Email: student@gmail.com</p>
            <p>Password: Student@123</p>
        </div>

        <p class="footer-text">© 2026 Student Profile Management</p>
    </div>
</div>

</body>
</html>
